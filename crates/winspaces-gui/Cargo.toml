[package]
name = "winspaces-gui"
version = "0.1.0"
edition = "2021"
authors = ["izantech <dev@izantech.app>"]

[[bin]]
name = "winspaces-gui"
path = "src/main.rs"

[dependencies]
winspaces-common = { path = "../winspaces-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wry = "0.49"
tao = "0.31"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
] }
