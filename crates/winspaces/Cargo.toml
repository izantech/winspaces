[package]
name = "winspaces"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Independent spaces per monitor, Overview and dynamic tiling for Windows"
readme = "../../README.md"
keywords = ["windows", "virtual-desktops", "tiling", "window-manager", "win32"]
categories = ["os::windows-apis", "gui"]

[[bin]]
name = "winspaces"
path = "src/main.rs"

[dependencies]
winspaces-common = { workspace = true }
winspaces-win32 = { workspace = true }
winspaces-core = { workspace = true }
winspaces-ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Only the modules this crate's own source names. Everything GDI/DWM/registry
# shaped moved out to winspaces-ui and winspaces-win32 and is declared there.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
