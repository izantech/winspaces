[package]
name = "winspaces-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
winspaces-common = { path = "../winspaces-common" }
winspaces-win32 = { path = "../winspaces-win32" }
winspaces-core = { path = "../winspaces-core" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # Not named by any path here: RegCreateKeyExW's signature references
    # SECURITY_ATTRIBUTES, so the registry calls do not compile without it.
    "Win32_Security",
] }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
